<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="manifest.json"/>
<title>Photobooth — iPad Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{"primary":"#1a73e8","on-primary":"#ffffff","surface":"#ffffff","surface-variant":"#f8f9fa","on-surface":"#202124","on-surface-variant":"#5f6368","outline":"#dadce0","error":"#ea4335","success":"#34a853"},fontFamily:{sans:["Google Sans","system-ui","-apple-system","sans-serif"],mono:["Roboto Mono","monospace"]},borderRadius:{xl:"8px","2xl":"24px"},spacing:{18:"72px",14:"56px"},boxShadow:{card:"0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15)"}}}}</script>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="h-full bg-surface text-on-surface antialiased overflow-hidden font-sans">

<!-- SCREEN: TEMPLATE SELECT -->
<section id="screen-template" class="screen active">
  <div class="w-full max-w-[800px] mx-auto px-6 py-12 flex flex-col items-center gap-8">
    <div class="text-center">
      <h1 class="text-[32px] font-bold tracking-tight">Photobooth</h1>
      <p class="text-on-surface-variant text-[14px] mt-1">Choose a template, then strike a pose</p>
    </div>
    <div class="grid grid-cols-2 gap-4 w-full max-w-[480px]">
      <div id="card-tpl-1" onclick="window.selectTemplate(1)" class="template-card selected bg-surface border-2 border-primary p-4 rounded-xl cursor-pointer shadow-sm hover:shadow-md transition-shadow">
        <div class="h-24 bg-surface-variant rounded-lg flex items-center justify-center text-[13px] font-medium text-on-surface-variant">Template A</div>
        <div class="font-bold text-[14px] mt-3">Classic Doodle</div>
        <div class="text-[12px] text-on-surface-variant">Hand-drawn borders</div>
      </div>
      <div id="card-tpl-2" onclick="window.selectTemplate(2)" class="template-card bg-surface border-2 border-outline p-4 rounded-xl cursor-pointer shadow-sm hover:shadow-md transition-shadow">
        <div class="h-24 bg-on-surface rounded-lg flex items-center justify-center text-[13px] font-medium text-white">Template B</div>
        <div class="font-bold text-[14px] mt-3">Minimalist Noir</div>
        <div class="text-[12px] text-on-surface-variant">Clean typography</div>
      </div>
    </div>
    <button id="btn-template-next" class="w-full max-w-[480px] h-[72px] rounded-2xl bg-primary text-on-primary font-bold text-[16px] shadow-card active:scale-[0.98] transition-transform flex items-center justify-center">
      <span class="material-symbols-outlined align-middle mr-2">photo_camera</span>Start Camera
    </button>
  </div>
</section>

<!-- SCREEN: CAMERA PREVIEW -->
<section id="screen-camera" class="screen">
  <div class="relative w-full h-full min-h-screen flex items-center justify-center bg-black overflow-hidden">
    <video id="video-preview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover scale-x-[-1]"></video>
    
    <!-- Top bar overlay -->
    <div class="absolute top-0 inset-x-0 p-6 flex items-center justify-between z-10 bg-gradient-to-b from-black/60 to-transparent">
      <button onclick="document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-template').classList.add('active')" class="px-5 h-[52px] rounded-full bg-white/20 backdrop-blur-md text-white font-medium text-[15px] flex items-center shadow border border-white/20 active:scale-95 transition-transform">← Change Template</button>
      <span class="px-4 py-2 rounded-full bg-black/40 backdrop-blur-md text-white text-[14px] font-medium border border-white/10"><span id="shots-label">3-shot</span> photostrip</span>
    </div>

    <!-- Bottom action overlay -->
    <div class="absolute bottom-0 inset-x-0 p-8 pb-12 flex flex-col items-center justify-center z-10 bg-gradient-to-t from-black/70 via-black/30 to-transparent">
      <button id="btn-start-capture" class="w-full max-w-[420px] h-[72px] rounded-full bg-primary text-on-primary font-bold text-[18px] shadow-2xl active:scale-[0.98] transition-transform flex items-center justify-center gap-2 border border-white/20">
        <span class="material-symbols-outlined text-[28px]">photo_camera</span>Tap to Start
      </button>
      <p id="camera-error" class="hidden mt-4 w-full max-w-[420px] bg-error/90 backdrop-blur text-white px-4 py-3 rounded-xl text-[14px] text-center"></p>
    </div>
  </div>
</section>

<!-- SCREEN: CAPTURE IN PROGRESS -->
<section id="screen-capture" class="screen">
  <div class="relative w-full h-full min-h-screen flex items-center justify-center bg-black overflow-hidden">
    <video id="video-capture" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover scale-x-[-1]"></video>
    <div id="flash" class="flash z-20"></div>

    <!-- Top info overlay -->
    <div class="absolute top-0 inset-x-0 p-6 flex items-center justify-between z-10 bg-gradient-to-b from-black/60 to-transparent">
      <button id="btn-reset-capture" class="px-5 h-[48px] rounded-full bg-white/20 backdrop-blur-md text-white font-medium text-[14px] flex items-center shadow border border-white/20 active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-[20px] mr-1">refresh</span>Reset
      </button>
      <div id="shot-progress" class="px-6 py-2 rounded-full bg-black/50 backdrop-blur-md text-white text-[18px] font-bold tracking-wide border border-white/15">Shot 1/4</div>
      <div class="w-[120px]"></div>
    </div>

    <!-- Central countdown overlay -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
      <span id="countdown-num" class="text-white font-black text-[140px] drop-shadow-[0_8px_30px_rgba(0,0,0,0.8)] select-none">3</span>
    </div>
  </div>
</section>

<!-- SCREEN: RESULT / QR -->
<section id="screen-result" class="screen">
  <div class="w-full max-w-[800px] mx-auto px-6 py-8 flex flex-col items-center gap-6">
    <div class="text-center">
      <h2 class="text-[24px] font-bold">Your Photostrip</h2>
      <p id="upload-status" class="text-on-surface-variant text-[14px] mt-1"></p>
    </div>
    <div class="w-full grid grid-cols-1 md:grid-cols-[1fr_320px] gap-8 items-center justify-center">
      <div class="bg-surface-variant p-4 rounded-2xl shadow-sm flex justify-center">
        <img id="result-img" class="h-[75vh] object-contain rounded-xl shadow" alt="photostrip"/>
      </div>
      <div class="bg-surface border border-outline rounded-2xl p-8 flex flex-col items-center gap-6 shadow-sm">
        <div id="qrcode" class="bg-white p-4 rounded-xl border border-outline/50 shadow-inner"></div>
        <div class="text-center space-y-1">
          <p class="font-bold text-[16px]">Scan to Download</p>
          <p class="text-[12px] text-on-surface-variant">Available for 24 hours</p>
        </div>
        <a id="download-link" target="_blank" rel="noopener" class="hidden w-full px-6 py-4 rounded-2xl bg-primary text-on-primary font-bold text-[15px] flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">download</span>Open Image
        </a>
      </div>
    </div>
    <button id="btn-start-over" class="w-full max-w-[480px] h-[72px] rounded-2xl bg-success text-white font-bold text-[16px] shadow-card active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
      <span class="material-symbols-outlined">restart_alt</span>Start Over
    </button>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
